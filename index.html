<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dulces en Halloween</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #1a0a0a 0%, #2d0a0a 50%, #0a0a1a 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }

        .container {
            text-align: center;
            z-index: 10;
        }

        h1 {
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
            font-size: 2.8rem;
            margin-bottom: 10px;
            color: #ff6b35;
        }

        .subtitulo {
            font-family: 'Comic Sans MS', 'Comic Sans', cursive;
            font-size: 1.8rem;
            margin-bottom: 40px;
            color: #ff6b35;
        }

        .buttons {
            display: flex;
            gap: 40px;
            justify-content: center;
            position: relative;
        }

        button {
            padding: 18px 50px;
            font-size: 1.5rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            user-select: none;
        }

        #si {
            background: linear-gradient(145deg, #00c853, #00a040);
            color: white;
            box-shadow: 0 6px 20px rgba(0, 200, 83, 0.4);
        }

        #si:hover {
            transform: scale(1.1);
            box-shadow: 0 8px 30px rgba(0, 200, 83, 0.6);
        }

        #no {
            background: linear-gradient(145deg, #d32f2f, #b71c1c);
            color: white;
            box-shadow: 0 6px 20px rgba(211, 47, 47, 0.4);
            position: absolute;
            left: 50%;
            top: 0;
            transform: translateX(80px);
        }

        #jumpscare {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            object-fit: cover;
            z-index: 100;
            display: none;
            background: black;
        }

        #mensaje {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: #000;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
            flex-direction: column;
        }

        #mensaje h1 {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: 3.5rem;
            color: #ffffff;
            text-align: center;
            padding: 20px;
            letter-spacing: 2px;
        }

        #porque {
            font-family: Impact, Haettenschweiler, 'Arial Narrow Bold', sans-serif;
            font-size: 2rem;
            color: #ffffff;
            text-align: center;
            margin-top: 30px;
            opacity: 0;
            transition: opacity 2s ease;
        }

        #porque.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container" id="pregunta">
        <h1 id="titulo">Dulces en Halloween</h1>
        <p class="subtitulo" id="subtitulo">empezar?</p>
        <div class="buttons" id="botones">
            <button id="si">SÍ</button>
            <button id="no">NO</button>
        </div>
    </div>

    <video id="jumpscare" playsinline>
        <source src="jumpscaree.mp4" type="video/mp4">
        Tu navegador no soporta video.
    </video>

    <div id="mensaje">
        <h1>jeje bromita<br>FELIZ JALOUIN</h1>
        <p id="porque">porque no te sales?</p>
    </div>

    <script>
        const btnNo = document.getElementById('no');
        const btnSi = document.getElementById('si');
        const video = document.getElementById('jumpscare');
        const pregunta = document.getElementById('pregunta');
        const mensaje = document.getElementById('mensaje');

        // Detectar si ya jugó antes (protegido contra sandbox)
        try {
            if (localStorage.getItem('yaJugo')) {
                document.getElementById('titulo').textContent = 'proximamente juego REAL';
                document.getElementById('subtitulo').style.display = 'none';
                document.getElementById('botones').style.display = 'none';
            }
        } catch (e) {}

        const teleportSound = new Audio('teleport.mp3');
        teleportSound.volume = 0.7;

        function moverNoLejos(e) {
            const btnWidth = btnNo.offsetWidth;
            const btnHeight = btnNo.offsetHeight;
            const maxX = window.innerWidth - btnWidth - 20;
            const maxY = window.innerHeight - btnHeight - 20;

            let newX, newY;
            let intentos = 0;

            do {
                newX = Math.random() * maxX;
                newY = Math.random() * maxY;
                intentos++;
            } while (
                Math.hypot(newX - e.clientX, newY - e.clientY) < 250 && intentos < 30
            );

            btnNo.style.position = 'fixed';
            btnNo.style.left = newX + 'px';
            btnNo.style.top = newY + 'px';
            btnNo.style.transform = 'none';

            teleportSound.currentTime = 0;
            teleportSound.play().catch(() => {});
        }

        document.addEventListener('mousemove', (e) => {
            const rect = btnNo.getBoundingClientRect();
            const centerX = rect.left + rect.width / 2;
            const centerY = rect.top + rect.height / 2;
            const distancia = Math.hypot(e.clientX - centerX, e.clientY - centerY);

            if (distancia < 140) {
                moverNoLejos(e);
            }
        });

        btnNo.addEventListener('mouseover', (e) => {
            moverNoLejos(e);
        });

        btnNo.addEventListener('click', (e) => {
            e.preventDefault();
            e.stopPropagation();
            moverNoLejos(e);
        });

        btnNo.addEventListener('mousedown', (e) => {
            e.preventDefault();
            e.stopPropagation();
            moverNoLejos(e);
        });

        btnSi.addEventListener('click', () => {
            // Guardar que ya jugó
            try {
                localStorage.setItem('yaJugo', 'true');
            } catch (e) {}

            pregunta.style.display = 'none';
            video.style.display = 'block';
            video.currentTime = 0;
            video.muted = false;
            video.volume = 1.0;

            const playPromise = video.play();
            if (playPromise !== undefined) {
                playPromise.catch(() => {
                    video.muted = true;
                    video.play();
                });
            }

            setTimeout(() => {
                video.pause();
                video.style.display = 'none';
                mensaje.style.display = 'flex';

                setTimeout(() => {
                    document.getElementById('porque').classList.add('show');

                    setTimeout(() => {
                        mensaje.style.display = 'none';
                        video.style.display = 'block';
                        video.currentTime = 0;
                        video.muted = false;
                        video.volume = 1.0;

                        const play2 = video.play();
                        if (play2 !== undefined) {
                            play2.catch(() => {
                                video.muted = true;
                                video.play();
                            });
                        }

                        setTimeout(() => {
                            try {
                                window.open('', '_self');
                                window.close();
                                self.close();
                            } catch (e) {}

                            document.body.innerHTML = `
                                <div style="background:#000;color:#fff;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;font-family:Impact,sans-serif;text-align:center;gap:20px;">
                                    <div style="font-size:2.5rem;">no se pudo cerrar sola</div>
                                    <div style="font-size:1.8rem;">cerrá la pestaña 💀</div>
                                </div>`;
                        }, 3000);

                    }, 15000);

                }, 30000);

            }, 3000);
        });
    </script>
</body>
</html>
